name: Reports (reusable)

on:
  workflow_call:
    inputs:
      config-path:
        description: "Path to team.toml in the calling repo"
        type: string
        default: "team.toml"
      dse-oss-reports-ref:
        description: "Git ref of dse-oss-reports to install (tag or SHA)"
        type: string
        default: "v0.2.0"
      uv-version:
        description: "Pinned uv version"
        type: string
        default: "0.9.*"
      pr-branch:
        description: "Branch name for the generated PR"
        type: string
        default: "update-reports"
    secrets:
      pat:
        description: "Fine-grained PAT with public-repo read access"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: Run pipeline
        env:
          DSE_OSS_REPORTS_TOKEN: ${{ secrets.pat }}
          REF: ${{ inputs.dse-oss-reports-ref }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          uvx --from "dse-oss-reports @ git+https://github.com/NASA-IMPACT/dse-oss-reports.git@${REF}" \
            dse-oss-reports --config "${CONFIG_PATH}" -v run-all

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Update reports for ${{ github.run_id }}"
          title: "Update reports (${{ steps.date.outputs.date }})"
          body: |
            Automated update of commit reports and visualization.
          branch: ${{ inputs.pr-branch }}
          add-paths: |
            reports/output/
            :!reports/output/*-manifest.json
            reports/_objectives_data.json
            docs/images/
            docs/objectives.md

name: Reports (reusable)

on:
  workflow_call:
    inputs:
      config-path:
        description: "Path to team.toml in the calling repo"
        type: string
        default: "team.toml"
      dse-oss-reports-ref:
        description: "Git ref of dse-oss-reports to install (tag or SHA)"
        type: string
        default: "v0.2.0"
      uv-version:
        description: "Pinned uv version"
        type: string
        default: "0.9.*"
      pr-branch:
        description: "Branch name for the generated PR"
        type: string
        default: "update-reports"
    secrets:
      pat:
        description: "Fine-grained PAT with public-repo read access"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: Run pipeline
        env:
          DSE_OSS_REPORTS_TOKEN: ${{ secrets.pat }}
        run: |
          uvx --from "dse-oss-reports @ git+https://github.com/NASA-IMPACT/dse-oss-reports.git@${{ inputs.dse-oss-reports-ref }}" \
            dse-oss-reports --config "${{ inputs.config-path }}" run-all

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update reports for ${{ github.run_id }}"
          title: "Update reports (${{ steps.date.outputs.date }})"
          body: |
            Automated update of commit reports and visualization.
          branch: ${{ inputs.pr-branch }}
          add-paths: |
            reports/output/
            reports/_objectives_data.py
            docs/images/
            docs/objectives.md

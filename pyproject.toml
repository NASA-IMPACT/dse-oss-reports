[project]
name = "dse-oss-reports"
version = "0.1.1"
description = "Shared library for open-source contribution reporting across NASA-ODSI DSE teams"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "NASA-ODSI" }]
dependencies = [
    "httpx>=0.28",
    "matplotlib>=3.10",
    "pandas>=2.3",
]

[project.urls]
Repository = "https://github.com/NASA-IMPACT/dse-oss-reports"

[project.scripts]
dse-oss-reports = "dse_oss_reports.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dse_oss_reports"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
